name: deploy na aws

on:
    push:
        branches: [master]
        
jobs: 
    build:
        runs-on: ubuntu-latest

        services:
          postgres:
            image: postgres:16
            env:
              POSTGRES_DB: tutorialseguranca
              POSTGRES_USER: admin
              POSTGRES_PASSWORD: 123456
            ports:
              - 5432:5432
            options: >-
              --health-cmd "pg_isready -U postgres -d tutorialseguranca"
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5

          redis:
            image: redis:7
            ports:
              - 6379:6379
            options: >-
              --health-cmd "redis-cli ping"
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Fazendo configuracao do java
              uses: actions/setup-java@v3
              with:
                distribution: "zulu"
                java-version: "21"

            - name: Criando arquivo .env
              env:
                ENV_FILE: ${{ secrets.ENV_FILE }}
              run: |
                printf '%s' "$ENV_FILE" > .env

            - name: Fazendo build do projeto
              run: mvn clean install && ls
