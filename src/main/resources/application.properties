spring.application.name=security

# Database connection URL, username, and password
spring.datasource.url=jdbc:postgresql://localhost:
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#create (apaga tudo e reinicia do zero) / update (ajusta o que mudou) / create-drop (cria inicio apaga quando para) / validate (só valida)/ none (não faz nada)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

#comando openssl rand -hex 32
api.security.token.secret=