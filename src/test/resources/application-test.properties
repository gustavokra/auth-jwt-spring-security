spring.application.name=security-test

# H2 em memória evita depender do Postgres local nos testes de API
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

api.security.token.secret=test-secret-key-must-be-long-enough-123456

# Redis: mocke o rate limit OU use Testcontainers
# Se o contexto falhar sem Redis, mocke ProxyManager / RateLimitFilter

recaptcha.secret=test-recaptcha-secret